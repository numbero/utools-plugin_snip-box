<style>/* Snip Box interaction prototype — entirely local and dependency free. */
:root,
body[data-theme="light"] {
  color-scheme: light;
  --page: #f3f3f7;
  --surface: #ffffff;
  --surface-soft: #fafafd;
  --surface-muted: #f2f2f7;
  --surface-hover: #ededf4;
  --surface-selected: #eeebfc;
  --surface-code: #fafafe;
  --text: #242331;
  --text-secondary: #686777;
  --text-muted: #6e6c7b;
  --line: #e8e7ee;
  --line-strong: #d9d7e3;
  --accent: #6754d9;
  --accent-ink: #ffffff;
  --action-shadow: 0 2px 4px #6754d919;
  --journey-shadow: 0 3px 12px #6754d90a;
  --accent-hover: #5946c6;
  --action-bg: var(--accent);
  --action-hover: var(--accent-hover);
  --accent-soft: #efecfd;
  --accent-line: #d8d0fa;
  --green: #358867;
  --green-soft: #eaf6ef;
  --amber: #a67428;
  --amber-soft: #fbf2e2;
  --red: #b94e60;
  --red-soft: #fceef0;
  --blue: #487fab;
  --blue-soft: #edf4fb;
  --shadow: 0 25px 60px -24px #28223740, 0 5px 18px -6px #2822371a;
  --modal-shadow: 0 20px 56px #17132430, 0 3px 12px #1713240d;
  --focus: 0 0 0 3px #6754d928;
  --overlay: #26243546;
}

body[data-theme="dark"] {
  color-scheme: dark;
  --page: #181a1c;
  --surface: #24272b;
  --surface-soft: #202327;
  --surface-muted: #2b2f34;
  --surface-hover: #33383e;
  --surface-selected: #2d3b49;
  --surface-code: #1f2226;
  --text: #edf0f3;
  --text-secondary: #bec4cc;
  --text-muted: #a7adb6;
  --line: #363b42;
  --line-strong: #474e57;
  --accent: #8eb9e8;
  --accent-ink: #172433;
  --accent-hover: #a4c8ed;
  --action-bg: var(--accent);
  --action-hover: var(--accent-hover);
  --accent-soft: #283440;
  --accent-line: #354658;
  --green: #88caa6;
  --green-soft: #293a33;
  --amber: #e0b675;
  --amber-soft: #3b3327;
  --red: #e8a0a0;
  --red-soft: #422d2d;
  --blue: #98bade;
  --blue-soft: #293544;
  --shadow: 0 25px 60px -24px #00000090, 0 5px 18px -6px #00000066;
  --modal-shadow: 0 20px 56px #00000065, 0 3px 12px #00000033;
  --focus: 0 0 0 3px #8eb9e832;
  --overlay: #10121490;
  --action-shadow: 0 2px 4px #00000020;
  --journey-shadow: 0 3px 12px #00000020;
}

body[data-theme="dark"][data-palette="jade"] {
  --accent: #83c6b3;
  --accent-ink: #172922;
  --accent-hover: #9bd2c2;
  --accent-soft: #273933;
  --accent-line: #344d42;
  --surface-selected: #2d4038;
  --focus: 0 0 0 3px #83c6b332;
}

body[data-theme="dark"][data-palette="sand"] {
  --accent: #d6bb8b;
  --accent-ink: #2b2418;
  --accent-hover: #e2cda7;
  --accent-soft: #393329;
  --accent-line: #544833;
  --surface-selected: #40392e;
  --focus: 0 0 0 3px #d6bb8b32;
}

body[data-theme="dark"][data-palette="azure"] {
  --accent: #69b1ff;
  --accent-ink: #07172c;
  --accent-hover: #8bc4ff;
  --action-bg: #2584ff;
  --action-hover: #4397ff;
  --accent-soft: #193857;
  --accent-line: #244160;
  --surface-selected: #1d4064;
  --focus: 0 0 0 3px #2584ff45;
  --action-shadow: 0 3px 12px #2584ff30;
}

body[data-theme="dark"][data-palette="emerald"] {
  --accent: #25e3b0;
  --accent-ink: #06241b;
  --accent-hover: #60edc7;
  --action-bg: #00d49a;
  --action-hover: #21e8b2;
  --accent-soft: #143d33;
  --accent-line: #215546;
  --surface-selected: #184d3d;
  --focus: 0 0 0 3px #00d49a45;
  --action-shadow: 0 3px 12px #00d49a28;
}

body[data-theme="dark"][data-palette="orange"] {
  --accent: #ffac63;
  --accent-ink: #2b1505;
  --accent-hover: #ffc48f;
  --action-bg: #ff8524;
  --action-hover: #ff9c4e;
  --accent-soft: #472f21;
  --accent-line: #68422b;
  --surface-selected: #533622;
  --focus: 0 0 0 3px #ff852445;
  --action-shadow: 0 3px 12px #ff852428;
}

body[data-theme="dark"] .filter-chip.active span { opacity: 1; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { min-width: 320px; }
body {
  margin: 0;
  min-width: 320px;
  background: var(--page);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: default; opacity: .45; }
button, input, select, textarea, a, [tabindex], summary { outline: none; }
:focus-visible { box-shadow: var(--focus); outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; border-color: var(--accent) !important; box-shadow: var(--focus); }
button { transition: background-color .15s, border-color .15s, color .15s, box-shadow .15s; }
button:active:not(:disabled) { transform: translateY(.5px); }
svg { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: middle; }
h1, h2, h3, p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
::selection { background: var(--accent-line); color: var(--text); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { border: 1px solid var(--surface); border-radius: 8px; background: var(--line-strong); }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.board { width: min(1120px, 100%); padding: 26px 32px 24px; margin: 0 auto; }
.board-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 23px; border-bottom: 1px solid var(--line-strong); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--accent-line); border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 17px; font-weight: 600; letter-spacing: -2px; padding-right: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.brand-copy { display: flex; flex-direction: column; gap: 1px; }
.brand-copy strong { font-size: 14px; letter-spacing: -.2px; font-weight: 650; }
.brand-copy span, .brand-copy small { color: var(--text-secondary); font-size: 11px; }
.board-meta { color: var(--text-secondary); font-size: 11px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.board-meta::before { content: ""; width: 5px; height: 5px; background: var(--accent); border-radius: 50%; opacity: .8; }
.board-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 27px 0 23px; }
.eyebrow { color: var(--accent); font-weight: 600; font-size: 11px; letter-spacing: .09em; margin-bottom: 7px; }
.board-intro h1 { font-size: 25px; font-weight: 650; line-height: 1.35; letter-spacing: -.7px; }
.board-intro p { color: var(--text-secondary); font-size: 12px; line-height: 1.7; margin-top: 7px; max-width: 540px; }
.board-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; flex-shrink: 0; padding-bottom: 2px; }
.segment { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-muted); border: 1px solid var(--line-strong); border-radius: 8px; }
.segment button { border: 0; border-radius: 5px; background: transparent; color: var(--text-secondary); padding: 5px 11px; font-size: 11px; line-height: 18px; white-space: nowrap; }
.segment button:hover { color: var(--text); }
.segment button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px #1b172216; font-weight: 550; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 33px; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--text); font-size: 12px; font-weight: 500; line-height: 18px; white-space: nowrap; }
.btn:hover { background: var(--surface-hover); border-color: var(--line-strong); }
.btn.primary { border-color: var(--action-bg); background: var(--action-bg); color: var(--accent-ink); box-shadow: var(--action-shadow); }
.btn.primary:hover { background: var(--action-hover); border-color: var(--action-hover); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); box-shadow: none; }
.btn.ghost:hover { background: var(--surface-hover); color: var(--text); }
.btn.danger { color: var(--red); border-color: var(--red-soft); background: var(--red-soft); }
.btn.danger:hover { filter: brightness(.97); }
.btn.small { min-height: 28px; padding: 4px 9px; font-size: 11px; }
.btn .kbd { margin-left: 4px; border-color: #ffffff35; background: #ffffff15; color: inherit; }
.icon-button { display: inline-grid; place-items: center; width: 29px; height: 29px; padding: 0; border: 1px solid transparent; border-radius: 6px; color: var(--text-secondary); background: transparent; flex: 0 0 auto; }
.icon-button:hover { background: var(--surface-hover); color: var(--text); }
.icon-button.active { color: var(--accent); background: var(--accent-soft); }
.icon-button.danger:hover { color: var(--red); background: var(--red-soft); }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 19px; padding: 0 4px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); color: var(--text-muted); font-family: inherit; font-size: 11px; font-weight: 500; line-height: 17px; white-space: nowrap; }

.stage { position: relative; display: flex; justify-content: center; overflow-x: auto; padding: 8px 7px 29px; margin: 0 -7px; scrollbar-width: thin; }
.window { box-sizing: content-box; width: 680px; min-width: 680px; flex: 0 0 auto; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
.window[data-layout="manage"] { width: 1040px; min-width: 1040px; }
.window-chrome { display: flex; align-items: center; position: relative; height: 36px; padding: 0 13px; border-bottom: 1px solid var(--line); background: var(--surface-soft); }
.traffic { display: flex; align-items: center; gap: 7px; }
.traffic span, .traffic i { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1px #0000000d; }
.traffic :nth-child(1) { background: #f37973; }
.traffic :nth-child(2) { background: #efc052; }
.traffic :nth-child(3) { background: #68bc8a; }
.window-caption { position: absolute; left: 50%; transform: translateX(-50%); color: var(--text-secondary); font-size: 11px; font-weight: 500; letter-spacing: .02em; }
.window-dimension { margin-left: auto; color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.app { display: flex; flex-direction: column; position: relative; height: 544px; overflow: hidden; background: var(--surface); }
.list-view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.spacer { flex: 1; }
.brand-mark { display: flex; justify-content: center; gap: 1px; }
.brand-mark span { color: var(--green); }
input[type="search"]::-webkit-search-cancel-button { display: none; }
.window[data-layout="manage"] .app { height: 650px; }
.app-search { display: flex; align-items: center; gap: 9px; min-height: 62px; padding: 13px 15px; border-bottom: 1px solid var(--line); background: var(--surface); flex: 0 0 auto; }
.search-box { display: flex; align-items: center; gap: 9px; min-width: 0; height: 36px; flex: 1; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface-soft); transition: border-color .15s, box-shadow .15s; }
.search-box:focus-within { border-color: var(--accent); box-shadow: var(--focus); background: var(--surface); }
.search-box > svg { color: var(--text-muted); width: 16px; height: 16px; }
.search-box input { flex: 1; width: 0; min-width: 0; border: 0; outline: none; box-shadow: none; background: transparent; color: var(--text); font-size: 13px; }
.search-box input::placeholder { color: var(--text-muted); }
.search-box input:focus-visible { box-shadow: none; }
.search-box .kbd { flex: 0 0 auto; background: var(--surface); }
#searchClear { width: 22px; height: 22px; }
#searchClear svg { width: 13px; height: 13px; }
#newButton { min-height: 34px; padding: 6px 11px; }
#settingsButton { width: 32px; height: 34px; }
.filter-bar { display: flex; align-items: center; gap: 6px; height: 43px; min-height: 43px; padding: 0 15px; overflow-x: auto; overflow-y: hidden; border-bottom: 1px solid var(--line); background: var(--surface); }
.filter-chip { display: inline-flex; flex: 0 0 auto; white-space: nowrap; align-items: center; justify-content: center; gap: 5px; padding: 4px 9px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--text-secondary); font-size: 11px; line-height: 18px; }
.filter-chip:hover { background: var(--surface-muted); color: var(--text); }
.filter-chip.active { color: var(--accent); background: var(--accent-soft); font-weight: 550; }
.filter-chip span { color: var(--text-muted); font-size: 11px; }
.filter-chip.active span { color: var(--accent); opacity: .75; }
.window[data-layout="manage"] .filter-bar { display: none; }
.workspace { display: flex; flex: 1; min-height: 0; overflow: hidden; }
.sidebar { display: none; flex: 0 0 148px; width: 148px; padding: 19px 10px 12px; border-right: 1px solid var(--line); background: var(--surface-soft); overflow-y: auto; }
.window[data-layout="manage"] .sidebar { display: flex; flex-direction: column; }
.sidebar-label { color: var(--text-muted); font-size: 11px; font-weight: 600; letter-spacing: .07em; margin: 0 10px 7px; }
.sidebar-label:not(:first-child) { margin-top: 25px; }
.nav-item { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 34px; margin: 2px 0; padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text-secondary); font-size: 12px; text-align: left; }
.nav-item svg { width: 15px; height: 15px; }
.nav-item:hover { background: var(--surface-hover); color: var(--text); }
.nav-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 550; }
.nav-count { margin-left: auto; color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.nav-item.active .nav-count { color: var(--accent); }
.group-dot { width: 7px; height: 7px; margin: 0 4px; flex: 0 0 auto; border-radius: 50%; background: var(--accent); opacity: .75; }
.group-dot.amber { background: var(--amber); }
.group-dot.green { background: var(--green); }
.group-dot.blue { background: var(--blue); }
.sidebar > .btn:last-child { margin-top: auto; }
.library { display: flex; flex-direction: column; flex: 0 0 250px; width: 250px; min-height: 0; border-right: 1px solid var(--line); background: var(--surface-soft); }
.window[data-layout="manage"] .library { width: 310px; flex-basis: 310px; }
.library-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 13px; min-height: 43px; flex: 0 0 auto; }
.library-header > div { display: flex; align-items: center; gap: 7px; }
.library-header h2, .library-header strong { font-size: 11px; font-weight: 600; }
.library-header span { color: var(--text-muted); font-size: 11px; }
.library-header select { max-width: 97px; padding: 3px 19px 3px 5px; background-color: transparent; border: 1px solid transparent; border-radius: 4px; color: var(--text-secondary); font-size: 11px; cursor: pointer; }
.library-header select:hover { background-color: var(--surface-muted); border-color: var(--line); }
.snippet-list { display: flex; flex-direction: column; gap: 5px; flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 10px; }
.snippet-row { position: relative; flex-shrink: 0; min-height: 88px; padding: 10px 10px 9px; border: 1px solid transparent; border-radius: 7px; background: transparent; cursor: pointer; transition: background .12s, border-color .12s; }
.snippet-row:hover { background: var(--surface-hover); }
.snippet-row.active { border-color: var(--accent-line); background: var(--surface-selected); }
.snippet-row:focus-visible { outline-offset: -2px; box-shadow: inset 0 0 0 2px var(--accent); outline: none; }
.snippet-row-top { display: flex; align-items: center; gap: 7px; height: 22px; }
.snippet-glyph { display: grid; place-items: center; width: 23px; height: 23px; flex: 0 0 auto; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; font-size: 11px; }
.snippet-glyph svg { width: 13px; height: 13px; }
.snippet-row.active .snippet-glyph { color: var(--accent); border-color: var(--accent-line); }
.snippet-name { flex: 1; min-width: 0; color: var(--text); font-size: 12px; font-weight: 550; line-height: 20px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.row-copy { width: 23px; height: 23px; color: var(--text-muted); opacity: .8; }
.row-copy svg { width: 13px; height: 13px; }
.snippet-row:hover .row-copy, .snippet-row.active .row-copy { opacity: 1; }
.row-copy:hover { color: var(--accent); background: var(--surface); }
.snippet-summary { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin: 7px 0 8px; color: var(--text-secondary); font-size: 11px; line-height: 17px; }
.snippet-row-meta { display: flex; align-items: center; gap: 5px; min-height: 17px; color: var(--text-muted); font-size: 11px; }
.snippet-row-meta > span:last-child:not(.tag) { margin-left: auto; }
.tag { display: inline-flex; align-items: center; max-width: 90px; height: 18px; padding: 1px 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 4px; color: var(--text-secondary); background: var(--surface-muted); font-size: 11px; font-weight: 500; line-height: 16px; }
.tag.violet { color: var(--accent); background: var(--accent-soft); }
.tag.amber { color: var(--amber); background: var(--amber-soft); }
.tag.green { color: var(--green); background: var(--green-soft); }
.tag.blue { color: var(--blue); background: var(--blue-soft); }
.snippet-row.active .tag.violet { background: var(--surface); }
.detail { display: flex; flex: 1; min-width: 0; min-height: 0; flex-direction: column; background: var(--surface); }
.detail-header { display: block; padding: 17px 18px 13px; flex: 0 0 auto; }
.detail-eyebrow { color: var(--text-muted); font-size: 11px; letter-spacing: .025em; margin-bottom: 5px; }
.detail-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.detail-title h2 { color: var(--text); font-size: 16px; line-height: 1.4; font-weight: 650; letter-spacing: -.3px; overflow-wrap: anywhere; }
.detail-actions { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
.detail-actions .icon-button { width: 25px; height: 25px; }
.detail-actions svg { width: 14px; height: 14px; }
.detail-tabs { display: flex; align-items: center; gap: 19px; min-height: 33px; padding: 0 18px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.detail-tabs button { position: relative; height: 33px; padding: 0 0 8px; border: 0; background: transparent; color: var(--text-muted); font-size: 11px; }
.detail-tabs button:hover { color: var(--text); }
.detail-tabs button.active { color: var(--accent); font-weight: 600; }
.detail-tabs button.active::after { position: absolute; content: ""; height: 2px; left: 0; right: 0; bottom: -1px; background: var(--accent); border-radius: 2px 2px 0 0; }
.preview-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 16px 18px 13px; overflow-y: auto; }
.preview-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; color: var(--text-muted); font-size: 11px; letter-spacing: .02em; }
.preview-heading > span:last-child { display: flex; align-items: center; gap: 4px; }
.live-dot { display: inline-block; width: 5px; height: 5px; margin-right: 4px; border-radius: 50%; background: var(--green); vertical-align: 1px; }
.rendered-text, .template-text { margin: 0; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "PingFang SC", monospace; font-size: 13px; line-height: 23px; tab-size: 2; }
.rendered-text { padding: 13px 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-code); }
.template-text { padding: 12px 0; }
.tok--clipboard, .tok--time, .tok--random, .tok--system, .tok--variable, .tok--pending, .tok--unknown, .tok--invalid, .tok--missing { padding: 1px 3px; border-radius: 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.tok--clipboard { color: var(--blue); background: var(--blue-soft); }
.tok--time { color: var(--green); background: var(--green-soft); }
.tok--random, .tok--system { color: var(--text-secondary); background: var(--surface-muted); }
.tok--variable { color: var(--accent); background: var(--accent-soft); }
.tok--pending, .tok--missing { color: var(--amber); background: var(--amber-soft); border-bottom: 1px dashed var(--amber); }
.tok--unknown, .tok--invalid { color: var(--red); background: var(--red-soft); border-bottom: 1px dashed var(--red); }
.detail-info { flex: 0 0 auto; margin: 0 18px; padding: 11px 0 12px; border-top: 1px solid var(--line); }
.meta-line { display: flex; align-items: center; gap: 7px; margin-top: 5px; color: var(--text-secondary); font-size: 11px; line-height: 16px; }

</main>
<script>/*
 * Snippet Box · 模板渲染引擎
 * 纯函数、无依赖、无 DOM 访问。设计稿与阶段三插件共用同一份。
 *
 * 环境红线（见 PRD §10.3）：渲染层 Chromium ~91 / preload Node ~14。
 * 禁用 structuredClone、crypto.randomUUID、String.replaceAll、Array.at、??=、ES module。
 * 本文件仅使用 var/function/正则/可选链，可在浏览器与纯 Node 下直接运行。
 */
(function (global) {
  'use strict';

  /* ---------------------------------------------------------------- *
   * 定界符预设
   * ---------------------------------------------------------------- */
  var DELIMITERS = {
    mustache: { open: '{{', close: '}}', label: '{{ }}' },
    dollar: { open: '${', close: '}', label: '${ }' },
    bracket: { open: '[[', close: ']]', label: '[ ]' }
  };

  /* ---------------------------------------------------------------- *
   * 占位符分类 —— 决定预览里的着色
   * ---------------------------------------------------------------- */
  var CATEGORY = {
    clipboard: 'clipboard',
    time: 'time',
    random: 'random',
    system: 'system',
    variable: 'variable'
  };

  /* ---------------------------------------------------------------- *
   * 随机源：优先 crypto.getRandomValues，退化到 Math.random
   * （crypto.randomUUID 在 Chromium 91 不可用，故手写 v4）
   * ---------------------------------------------------------------- */
  function randomBytes(n) {
    var out = new Array(n);
    var c = global.crypto || global.msCrypto;
    if (c && typeof c.getRandomValues === 'function') {
      var buf = new Uint8Array(n);
      c.getRandomValues(buf);
      for (var i = 0; i < n; i++) out[i] = buf[i];
      return out;
    }
    for (var j = 0; j < n; j++) out[j] = Math.floor(Math.random() * 256);
    return out;
  }

  function uuid4(upper) {
    var b = randomBytes(16);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    var hex = [];
    for (var i = 0; i < 16; i++) hex.push((b[i] + 0x100).toString(16).slice(1));
    var s = hex.join('');
    var v = s.slice(0, 8) + '-' + s.slice(8, 12) + '-' + s.slice(12, 16) +
            '-' + s.slice(16, 20) + '-' + s.slice(20);
    return upper ? v.toUpperCase() : v;
  }

  var NANOID_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-';

  function nanoid(len) {
    var b = randomBytes(len);
    var s = '';
    for (var i = 0; i < len; i++) s += NANOID_ALPHABET[b[i] & 63];
    return s;
  }

  function randomInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  /* ---------------------------------------------------------------- *
   * 日期：格式化 + 偏移
   * ---------------------------------------------------------------- */
  var WEEKDAY_CN = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  var WEEKDAY_CN_SHORT = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var WEEKDAY_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  function pad(n, len) {
    var s = String(n);
    while (s.length < (len || 2)) s = '0' + s;
    return s;
  }

  // 顺序很重要：长 token 必须排在短 token 前面
  var FORMAT_RE = /YYYY|YY|dddd|ddd|DD|D|MM|M|HH|hh|mm|ss|SSS|A|a|X|x|\[([^\]]*)\]/g;

  function formatDate(d, fmt) {
    var h24 = d.getHours();
    var h12 = h24 % 12 === 0 ? 12 : h24 % 12;
    var ms = d.getMilliseconds();
    return fmt.replace(FORMAT_RE, function (token, escaped) {
      if (escaped !== undefined) return escaped;
      switch (token) {
        case 'YYYY': return String(d.getFullYear());
        case 'YY': return pad(d.getFullYear() % 100);
        case 'dddd': return WEEKDAY_CN[d.getDay()];
        case 'ddd': return WEEKDAY_CN_SHORT[d.getDay()];
        case 'DD': return pad(d.getDate());
        case 'D': return String(d.getDate());
        case 'MM': return pad(d.getMonth() + 1);
        case 'M': return String(d.getMonth() + 1);
        case 'HH': return pad(h24);
        case 'hh': return pad(h12);
        case 'mm': return pad(d.getMinutes());
        case 'ss': return pad(d.getSeconds());
        case 'SSS': return pad(ms, 3);
        case 'A': return h24 < 12 ? 'AM' : 'PM';
        case 'a': return h24 < 12 ? 'am' : 'pm';
        case 'X': return String(Math.floor(d.getTime() / 1000));
        case 'x': return String(d.getTime());
        default: return token;
      }
    });
  }

  var OFFSET_RE = /^([+-])(\d+)([yMwdhms])$/;
  var SPECIAL_RE = /^@(startOfDay|endOfDay|startOfWeek|endOfWeek|startOfMonth|endOfMonth)$/;

  function applyOffset(base, spec) {
    var d = new Date(base.getTime());
    var sp = SPECIAL_RE.exec(spec);
    if (sp) {
      switch (sp[1]) {
        case 'startOfDay': d.setHours(0, 0, 0, 0); break;
        case 'endOfDay': d.setHours(23, 59, 59, 999); break;
        case 'startOfWeek':
          d.setHours(0, 0, 0, 0);
          d.setDate(d.getDate() - d.getDay());
          break;
        case 'endOfWeek':
          d.setHours(23, 59, 59, 999);
          d.setDate(d.getDate() + (6 - d.getDay()));
          break;
        case 'startOfMonth': d.setDate(1); d.setHours(0, 0, 0, 0); break;
        case 'endOfMonth':
          d.setMonth(d.getMonth() + 1, 1);
          d.setDate(0);
          d.setHours(23, 59, 59, 999);
          break;
      }
      return d;
    }
    var m = OFFSET_RE.exec(spec);
    if (!m) return null;
    var sign = m[1] === '-' ? -1 : 1;
    var n = parseInt(m[2], 10) * sign;
    switch (m[3]) {
      case 'y': d.setFullYear(d.getFullYear() + n); break;
      case 'M': d.setMonth(d.getMonth() + n); break;
      case 'w': d.setDate(d.getDate() + n * 7); break;
      case 'd': d.setDate(d.getDate() + n); break;
      case 'h': d.setHours(d.getHours() + n); break;
      case 'm': d.setMinutes(d.getMinutes() + n); break;
      case 's': d.setSeconds(d.getSeconds() + n); break;
    }
    return d;
  }

  function isOffsetSpec(s) {
    return s.charAt(0) === '+' || s.charAt(0) === '-' || s.charAt(0) === '@';
  }

  var DEFAULT_FORMAT = {
    date: 'YYYY-MM-DD',
    time: 'HH:mm:ss',
    datetime: 'YYYY-MM-DD HH:mm:ss',
    today: 'YYYY-MM-DD',
    yesterday: 'YYYY-MM-DD',
    tomorrow: 'YYYY-MM-DD',
    now: 'YYYY-MM-DD HH:mm:ss'
  };

  var TIME_ALIASES = {
    today: 'date',
    yesterday: 'date',
    tomorrow: 'date',
    now: 'datetime'
  };

  /* ---------------------------------------------------------------- *
   * 占位符求值
   * 返回 { value, state, note } —— state: ok | missing | invalid | variable
   * ---------------------------------------------------------------- */
  function resolveDate(name, params, now) {
    var baseName = TIME_ALIASES[name] || name;
    var base = new Date(now.getTime());

    if (name === 'yesterday') base = applyOffset(base, '-1d');
    if (name === 'tomorrow') base = applyOffset(base, '+1d');

    if (name === 'timestamp') return { value: String(Math.floor(base.getTime() / 1000)), state: 'ok' };
    if (name === 'timestamp_ms') return { value: String(base.getTime()), state: 'ok' };
    if (name === 'iso') return { value: base.toISOString(), state: 'ok' };

    var offsetSpec = null;
    var fmt = DEFAULT_FORMAT[baseName] || 'YYYY-MM-DD';

    if (params.length >= 1 && params[0] !== '') {
      if (isOffsetSpec(params[0])) {
        offsetSpec = params[0];
        if (params.length >= 2) fmt = params[1];
      } else {
        fmt = params[0];
        // 允许 {{date:YYYY-MM-DD:-1d}} 这种把偏移写在第二段的写法
        if (params.length >= 2 && isOffsetSpec(params[1])) offsetSpec = params[1];
      }
    }

    if (offsetSpec) {
      var shifted = applyOffset(base, offsetSpec);
      if (!shifted) {
        return { value: null, state: 'invalid', note: '偏移量无法解析：' + offsetSpec + '（示例 -1d / +2h / @startOfMonth）' };
      }
      base = shifted;
    }

    var single = { year: 'YYYY', month: 'MM', day: 'DD', hour: 'HH', minute: 'mm', second: 'ss' };
    if (single[baseName]) fmt = single[baseName];

    if (baseName === 'weekday') {
      var mode = (params[0] || '').toLowerCase();
      var idx = base.getDay();
      if (mode === 'short') return { value: WEEKDAY_CN_SHORT[idx], state: 'ok' };
      if (mode === 'en') return { value: WEEKDAY_EN[idx], state: 'ok' };
      if (mode === 'num') return { value: String(idx), state: 'ok' };
      if (mode === '') return { value: WEEKDAY_CN[idx], state: 'ok' };
      return { value: null, state: 'invalid', note: 'weekday 只接受 short / en / num' };
    }

    var out = formatDate(base, fmt);
    // 格式串里有 ASCII 字母却一个记号都没命中 —— 大概率是拼写错误（如 zzz、YYY）
    if (/[A-Za-z]/.test(fmt) && out === fmt) {
      return {
        value: null, state: 'invalid',
        note: '格式串 "' + fmt + '" 里没有可识别的记号（可用：YYYY MM DD HH mm ss ddd SSS A X 等）'
      };
    }
    return { value: out, state: 'ok' };
  }

  function resolveClipboard(params, ctx) {
    var text = ctx.clipboard;
    if (text === null || text === undefined) {
      return { value: '', state: 'missing', note: '剪贴板为空或读取失败' };
    }
    var mode = (params[0] || '').toLowerCase();
    if (mode === '') return { value: text, state: 'ok' };
    if (mode === 'trim') return { value: text.replace(/^\s+|\s+$/g, ''), state: 'ok' };
    if (mode === 'upper') return { value: text.toUpperCase(), state: 'ok' };
    if (mode === 'lower') return { value: text.toLowerCase(), state: 'ok' };
    if (/^\d+$/.test(mode)) return { value: text.slice(0, parseInt(mode, 10)), state: 'ok' };
    // 支持 {{clipboard:line:2}} 与 {{clipboard:line|2}} 两种写法
    var lineNo = null;
    if (mode.indexOf('line:') === 0) lineNo = parseInt(mode.slice(5), 10);
    else if (mode === 'line') lineNo = parseInt(params[1], 10);
    if (lineNo !== null) {
      if (!lineNo || lineNo < 1) return { value: null, state: 'invalid', note: 'line 需要一个从 1 开始的行号' };
      var lines = text.split('\n');
      return { value: lineNo > lines.length ? '' : lines[lineNo - 1], state: 'ok' };
    }
    return { value: null, state: 'invalid', note: 'clipboard 只接受 trim / upper / lower / 数字 / line:n' };
  }

  function resolveSystem(name, params, ctx) {
    var sys = ctx.sys || {};
    var v;
    switch (name) {
      case 'user': v = sys.user; break;
      case 'home': v = sys.home; break;
      case 'hostname': v = sys.hostname; break;
      case 'platform': v = sys.platform; break;
      case 'os': v = sys.os; break;
      case 'arch': v = sys.arch; break;
      case 'tmpdir': v = sys.tmpdir; break;
      case 'cwd': v = sys.cwd; break;
      case 'appversion': v = sys.appVersion; break;
      case 'pluginversion': v = sys.pluginVersion; break;
      case 'folder': v = ctx.folder; break;
      case 'url':
        if (!ctx.url) return { value: '', state: 'missing', note: '唤起时焦点不在浏览器，无可用 URL' };
        v = (params[0] || '').toLowerCase() === 'title' ? ctx.url.title : ctx.url.url;
        break;
      default: return null;
    }
    if (v === null || v === undefined || v === '') {
      return { value: '', state: 'missing', note: '无可用上下文' };
    }
    return { value: String(v), state: 'ok' };
  }

  function resolveRandom(name, params) {
    if (name === 'uuid') {
      var mode = (params[0] || '').toLowerCase();
      if (mode === '' || mode === 'v4') return { value: uuid4(false), state: 'ok', volatile: true };
      if (mode === 'upper') return { value: uuid4(true), state: 'ok', volatile: true };
      if (mode === 'short') return { value: uuid4(false).replace(/-/g, '').slice(0, 16), state: 'ok', volatile: true };
      return { value: null, state: 'invalid', note: 'uuid 只接受 upper / short' };
    }
    if (name === 'nanoid') {
      var len = params[0] ? parseInt(params[0], 10) : 16;
      if (!len || len < 1 || len > 128) return { value: null, state: 'invalid', note: 'nanoid 长度需在 1-128 之间' };
      return { value: nanoid(len), state: 'ok', volatile: true };
    }
    if (name === 'random') {
      var spec = params[0] || '';
      var sep = spec.indexOf('~') >= 0 ? '~' : '-';
      var parts = spec.split(sep);
      if (parts.length === 2 && parts[0] !== '' && parts[1] !== '') {
        var lo = parseInt(parts[0], 10);
        var hi = parseInt(parts[1], 10);
        if (isNaN(lo) || isNaN(hi)) return { value: null, state: 'invalid', note: 'random 区间需为两个整数' };
        if (lo > hi) { var t = lo; lo = hi; hi = t; }
        return { value: String(randomInt(lo, hi)), state: 'ok', volatile: true };
      }
      if (/^\d+$/.test(spec) && spec !== '') {
        var n = parseInt(spec, 10);
        if (n < 1 || n > 64) return { value: null, state: 'invalid', note: 'random 位数需在 1-64 之间' };
        var digits = '';
        for (var i = 0; i < n; i++) digits += String(Math.floor(Math.random() * 10));
        return { value: digits, state: 'ok', volatile: true };
      }
      return { value: null, state: 'invalid', note: 'random 需要 min-max 或位数，如 1-100 / 6' };
    }
    if (name === 'pick') {
      if (params.length < 2) return { value: null, state: 'invalid', note: 'pick 至少需要两项，用 | 分隔' };
      return { value: params[randomInt(0, params.length - 1)], state: 'ok', volatile: true };
    }
    if (name === 'shuffle') {
      var items = (params[0] || '').split(',');
      if (items.length < 2) return { value: null, state: 'invalid', note: 'shuffle 至少需要两项，用逗号分隔' };
      var arr = items.slice();
      for (var k = arr.length - 1; k > 0; k--) {
        var r = randomInt(0, k);
        var tmp = arr[k]; arr[k] = arr[r]; arr[r] = tmp;
      }
      return { value: arr.join(','), state: 'ok', volatile: true };
    }
    return null;
  }

  var DATE_NAMES = ['date', 'time', 'datetime', 'iso', 'timestamp', 'timestamp_ms',
    'year', 'month', 'day', 'hour', 'minute', 'second', 'weekday',
    'today', 'yesterday', 'tomorrow', 'now'];
  var SYSTEM_NAMES = ['user', 'home', 'hostname', 'platform', 'os', 'arch', 'tmpdir',
    'cwd', 'folder', 'url', 'appversion', 'pluginversion'];
  var RANDOM_NAMES = ['uuid', 'nanoid', 'random', 'pick', 'shuffle'];

  function categoryOf(name) {
    if (name === 'clipboard') return CATEGORY.clipboard;
    if (DATE_NAMES.indexOf(name) >= 0) return CATEGORY.time;
    if (RANDOM_NAMES.indexOf(name) >= 0) return CATEGORY.random;
    if (SYSTEM_NAMES.indexOf(name) >= 0) return CATEGORY.system;
    return null;
  }

  /* ---------------------------------------------------------------- *
   * 解析模板 -> segments
   * ---------------------------------------------------------------- */
  function parse(tpl, options) {
    var opts = options || {};
    var delim = DELIMITERS[opts.delimiter || 'mustache'] || DELIMITERS.mustache;
    var open = delim.open;
    var close = delim.close;
    var ctx = opts.context || {};
    var now = ctx.now instanceof Date ? ctx.now : new Date();
    var filled = ctx.variables || {};

    var segments = [];
    var variables = [];
    var seenVars = {};
    var issues = [];
    var i = 0;
    var buf = '';

    function flush() {
      if (buf !== '') { segments.push({ type: 'text', value: buf }); buf = ''; }
    }

    while (i < tpl.length) {
      // 转义：\{{ -> 字面量 {{
      if (tpl.charAt(i) === '\\' && tpl.substr(i + 1, open.length) === open) {
        buf += open;
        i += 1 + open.length;
        continue;
      }
      if (tpl.substr(i, open.length) === open) {
        var end = tpl.indexOf(close, i + open.length);
        if (end < 0) { buf += tpl.charAt(i); i++; continue; }   // 不成对，当普通文本

        var inner = tpl.substring(i + open.length, end);
        var raw = tpl.substring(i, end + close.length);

        if (inner.indexOf(open) >= 0 || inner.indexOf('\n') >= 0) {
          // 嵌套或跨行：不解析
          buf += raw;
          i = end + close.length;
          continue;
        }

        flush();
        segments.push(evalPlaceholder(inner, raw));
        i = end + close.length;
        continue;
      }
      buf += tpl.charAt(i);
      i++;
    }
    flush();

    function evalPlaceholder(inner, raw) {
      var body = inner.replace(/^\s+|\s+$/g, '');

      // 待填变量 {{?name}} / {{?name=default}}
      if (body.charAt(0) === '?') {
        var vbody = body.slice(1);
        var eq = vbody.indexOf('=');
        var vname = (eq >= 0 ? vbody.slice(0, eq) : vbody).replace(/^\s+|\s+$/g, '');
        var vdefault = eq >= 0 ? vbody.slice(eq + 1) : '';
        if (vname === '' || /[\s={}]/.test(vname)) {
          issues.push({ raw: raw, level: 'invalid', note: '变量名不能为空，且不能含空格或 = { }' });
          return { type: 'ph', raw: raw, name: body, category: CATEGORY.variable, state: 'invalid', note: '变量名非法' };
        }
        if (!seenVars[vname]) {
          seenVars[vname] = true;
          variables.push({ name: vname, defaultValue: vdefault });
        }
        var hasFill = Object.prototype.hasOwnProperty.call(filled, vname);
        return {

  function more() {const s=selected();if(!s)return;showModal('more',modalShell('管理片段',esc(s.name),'<div class="more-actions">'+btn(icon('edit')+' 编辑片段','edit')+btn(icon('copy')+' 创建副本','duplicate')+btn(icon('star')+(s.pinned?' 取消置顶':' 置顶片段'),'pin')+btn('删除片段','delete-confirm','danger')+'</div>',''+btn('返回','close-modal','ghost'),true));}
  function confirmDelete() {const s=selected();closeModal();showModal('delete',modalShell('删除这个片段？',esc(s.name),'删除后，它的直达关键字也会一并移除。',btn('取消','close-modal')+btn('删除片段','delete','danger'),true),{id:s.id});}
  function groupsModal() {showModal('groups',modalShell('管理分组','删除分组时，片段会保留并移到「未分组」。','<div class="group-list">'+state.groups.map(g=>'<div class="group-manage-row"><span class="group-dot" style="background:'+groupTint(g)+'"></span><span>'+esc(g.name)+'</span><span class="spacer"></span>'+btn('改名','rename-group','ghost small','data-group="'+esc(g.id)+'"')+btn('删除','delete-group-confirm','danger small','data-group="'+esc(g.id)+'"')+'</div>').join('')+'</div>',''+btn('完成','close-modal')+btn('＋ 新建分组','add-group','primary')));}
  function groupForm(id) {const g=group(id);closeModal();showModal('group-form',modalShell(g?'重命名分组':'新建分组','用一个容易识别的名字，组织你的片段。',field('分组名称','groupName',g?g.name:'','例如：常用回复')+'<div class="modal-error" id="groupError" role="alert" hidden></div>',btn('取消','close-modal')+btn('保存分组','save-group','primary'),true),{id:g?g.id:null});}
  function saveGroup() {const name=$('groupName').value.trim(),id=state.modal.id;if(!name||state.groups.some(g=>g.id!==id&&g.name===name)){$('groupError').textContent=name?'已存在同名分组。':'请输入分组名称。';$('groupError').hidden=false;return;}if(id)group(id).name=name;else state.groups.push({id:uid(),name,color:'#7861d9'});closeModal();persist();renderList();groupsModal();}
  function settings() {
    state.view='settings';render();
    $('settingsView').innerHTML='<header class="settings-header"><button type="button" class="icon-button" data-action="back-list" aria-label="返回列表">'+icon('back')+'</button><strong>设置</strong><span class="spacer"></span><span class="tag">演示环境</span></header><div class="settings-scroll"><div class="settings-section"><h3>输出与外观</h3><div class="settings-row"><div><label for="settingOutput">默认输出方式</label><p>回车使用默认方式，⌥ 回车临时反向。</p></div><select id="settingOutput"><option value="paste" '+(state.settings.output==='paste'?'selected':'')+'>自动粘贴</option><option value="copy" '+(state.settings.output==='copy'?'selected':'')+'>仅复制</option></select></div><div class="settings-row"><div><label for="settingTheme">界面主题</label><p>列表、编辑器和弹窗使用同一套主题。</p></div><select id="settingTheme"><option value="light" '+(state.settings.theme==='light'?'selected':'')+'>浅色</option><option value="dark" '+(state.settings.theme==='dark'?'selected':'')+'>深色</option></select></div><div class="settings-row"><div><label for="settingDelimiter">占位符定界符</label><p>只改变解析方式，不会改写已保存模板。</p></div><select id="settingDelimiter"><option value="mustache" '+(state.settings.delimiter==='mustache'?'selected':'')+'>{{ }}</option><option value="dollar" '+(state.settings.delimiter==='dollar'?'selected':'')+'>${ }</option><option value="bracket" '+(state.settings.delimiter==='bracket'?'selected':'')+'>[[ ]]</option></select></div></div><div class="settings-section"><h3>备份与数据</h3><div class="settings-row"><div><strong>导出演示数据</strong><p>包含片段、分组和设置的 JSON 文件。</p></div>'+btn('导出 JSON','export')+'</div><div class="settings-row"><div><strong>导入备份</strong><p>完整校验后，再确认替换本设计稿的数据。</p></div>'+btn('选择文件','import')+'<input id="importFile" type="file" accept=".json,application/json" hidden></div><div class="settings-row"><div><strong>重置演示数据</strong><p>恢复最初的 10 条示例，不涉及正式插件。</p></div>'+btn('重置','reset-confirm','danger')+'</div></div><div class="settings-section"><h3>键盘快捷操作</h3><div class="shortcut-grid"><span>聚焦搜索 <kbd>⌘ K</kbd></span><span>新建片段 <kbd>⌘ N</kbd></span><span>编辑选中片段 <kbd>⌘ E</kbd></span><span>保存 / 确认 <kbd>⌘ ↵</kbd></span></div><p class="helper">Esc 关闭弹窗或清空搜索；填写变量时，Enter 跳到下一项，最后一项确认输出。</p></div><div class="settings-section about-note"><h3>关于此设计稿</h3><p>纯本地示例数据，不接入 uTools。复制使用浏览器剪贴板；自动粘贴与失败反馈均为模拟。正式插件的跨应用输出仍需在 uTools 内验证。</p></div></div>';
  }
  function contextModal() {showModal('context',modalShell('本次上下文快照','刷新后，预览和下一次输出会一起更新。','<div class="field"><label for="contextClipboard">剪贴板文本</label><textarea id="contextClipboard" rows="3">'+esc(context.clipboard)+'</textarea></div>'+field('当前目录','contextFolder',context.folder||'','留空可查看上下文缺失状态')+'<label class="toggle-row"><span>模拟下一次粘贴失败</span><input type="checkbox" id="contextFailure" '+(state.failNext?'checked':'')+'></label>',btn('取消','close-modal')+btn(icon('refresh')+' 更新快照','save-context','primary')));}
  function resetConfirm() {showModal('reset',modalShell('恢复初始演示？','本设计稿里新增和修改的内容将被替换。','正式插件中的片段不会受到影响。',btn('取消','close-modal')+btn('恢复演示数据','reset','danger'),true));}
  function exportData() {const data={format:'snippet-box-prototype',version:1,exportedAt:new Date().toISOString(),groups:state.groups,snippets:state.snippets,settings:state.settings};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='snippet-box-design-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('演示数据已导出。');}
  async function importData(file) {if(!file)return;try{if(file.size>5*1024*1024)throw new Error('文件大小不能超过 5 MB。');const data=validate(JSON.parse(await file.text()));showModal('import',modalShell('导入这份演示备份？','文件已完成校验。确认后将替换当前演示数据。','<p>'+data.snippets.length+' 条片段 · '+data.groups.length+' 个分组 · 同时恢复设置</p>',btn('取消','close-modal')+btn('确认替换','confirm-import','primary'),true),{data});}catch(e){showModal('import-error',modalShell('这份文件无法导入','当前数据保持原样。','<p class="modal-error">'+esc(e.message)+'</p>',btn('知道了','close-modal','primary'),true));}}
  function doAction(action,el) {
    const s=selected();
    switch(action) {
      case 'new': openEditor();break;
      case 'clear-search':state.query='';$('searchInput').value='';renderList();$('searchInput').focus();break;
      case 'search-all':state.filter='all';renderList();break;
      case 'row-copy':requestOutput(state.snippets.find(x=>x.id===el.dataset.id),'copy');break;
      case 'copy':requestOutput(s,'copy');break;
      case 'output':requestOutput(s,state.settings.output);break;
      case 'pin':if(state.modal)closeModal();if(s){s.pinned=!s.pinned;persist();renderList();}break;
      case 'edit':if(state.modal)closeModal();if(s)openEditor(s);break;
      case 'more':more();break;
      case 'duplicate':closeModal();if(s){const d=Object.assign({},s,{id:'',name:s.name+' 副本',direct:false,keyword:'',useCount:0,lastUsedAt:''});openEditor(d);}break;
      case 'delete-confirm':confirmDelete();break;
      case 'delete':{const id=state.modal.id;state.snippets=state.snippets.filter(x=>x.id!==id);closeModal();persist();renderList();toast('片段已删除。');break;}
      case 'groups':groupsModal();break;
      case 'add-group':groupForm();break;
      case 'rename-group':groupForm(el.dataset.group);break;
      case 'save-group':saveGroup();break;
      case 'delete-group-confirm':{const g=group(el.dataset.group);closeModal();showModal('delete-group',modalShell('删除「'+esc(g.name)+'」分组？','分组内的片段会保留，移到「未分组」。','<p>这不会删除任何片段。</p>',btn('取消','close-modal')+btn('删除分组','delete-group','danger'),true),{id:g.id});break;}
      case 'delete-group':{const id=state.modal.id;state.groups=state.groups.filter(g=>g.id!==id);state.snippets.forEach(x=>{if(x.group===id)x.group='';});state.filter='all';closeModal();persist();renderList();toast('分组已删除，片段已保留。');break;}
      case 'close-modal':closeModal();break;
      case 'variable-copy':completeVariables('copy');break;
      case 'variable-output':completeVariables();break;
      case 'failure-copy':{const m=state.modal;closeModal();output(m.snippet,'copy',m.text);break;}
      case 'save-context':context.clipboard=$('contextClipboard').value;context.folder=$('contextFolder').value||null;context.now=new Date();state.failNext=$('contextFailure').checked;state.ctxVersion++;cache=new Map();closeModal();renderList();toast('上下文快照已更新。');break;
      case 'leave-editor':leaveEditor();break;
      case 'discard':{const next=state.modal.next;closeModal();next();break;}
      case 'save':{const next=state.modal&&state.modal.kind==='discard'?state.modal.next:state.afterSave;if(state.modal)closeModal();state.afterSave=next;saveDraft();break;}
      case 'catalog':showCatalog();break;
      case 'back-list':state.view='list';render();$('searchInput').focus();break;
      case 'export':exportData();break;
      case 'import':$('importFile').click();break;
      case 'confirm-import':{const data=state.modal.data;state.snippets=data.snippets;state.groups=data.groups;state.settings=data.settings;state.selected=null;state.filter='all';state.query='';cache=new Map();closeModal();persist();settings();toast('备份已恢复。');break;}
      case 'reset-confirm':resetConfirm();break;
      case 'reset':{const data=seed();state.groups=data.groups;state.snippets=data.snippets;state.settings=data.settings;state.filter='all';state.query='';state.selected='commit';state.view='list';state.draft=null;state.tab='preview';state.failNext=false;$('searchInput').value='';cache=new Map();closeModal();persist();render();toast('已恢复初始演示。');break;}
    }
  }
  $('prototypeApp').addEventListener('click',e=>{
    const action=e.target.closest('[data-action]');if(action){doAction(action.dataset.action,action);return;}
    const f=e.target.closest('[data-filter]');if(f){setFilter(f.dataset.filter);return;}
    const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;renderDetail();$('detailPane').querySelector('[aria-selected="true"]').focus();return;}
    const insert=e.target.closest('[data-insert]');if(insert){insertPlaceholder(insert.dataset.insert);return;}
    const row=e.target.closest('[data-snippet]');if(row){state.selected=row.dataset.snippet;renderList();$('snippetList').querySelector('[aria-selected="true"]').focus();}
  });
  $('snippetList').addEventListener('dblclick',e=>{const row=e.target.closest('[data-snippet]');if(row&&!e.target.closest('button'))requestOutput(selected(),state.settings.output);});
  $('searchInput').addEventListener('input',e=>{state.query=e.target.value;renderList();});
  $('searchClear').addEventListener('click',()=>doAction('clear-search'));
  $('sortSelect').addEventListener('change',e=>{state.sort=e.target.value;renderList();});
  $('newButton').addEventListener('click',()=>openEditor());
  $('settingsButton').addEventListener('click',settings);
  $('contextButton').addEventListener('click',contextModal);
  $('themeButton').addEventListener('click',()=>{state.settings.theme=state.settings.theme==='light'?'dark':'light';persist();theme();if(state.view==='settings')settings();});
  document.querySelectorAll('button[data-palette]').forEach(b=>b.addEventListener('click',()=>{state.settings.palette=b.dataset.palette;state.settings.theme='dark';persist();theme();if(state.view==='settings')settings();}));
  $('resetButton').addEventListener('click',resetConfirm);
  document.querySelectorAll('[data-layout]').forEach(b=>{if(b.tagName!=='BUTTON')return;b.addEventListener('click',()=>{state.layout=b.dataset.layout;document.querySelectorAll('button[data-layout]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});render();});});
  document.querySelectorAll('[data-journey]').forEach(b=>b.addEventListener('click',()=>leaveEditor(()=>{
    if(state.modal)closeModal();state.view='list';state.query='';state.filter='all';$('searchInput').value='';render();
    if(b.dataset.journey==='search'){state.query='sign';$('searchInput').value='sign';renderList();$('searchInput').focus();}
    if(b.dataset.journey==='variables'){state.selected='commit';renderList();requestOutput(selected(),state.settings.output);}
    if(b.dataset.journey==='editor'){openEditor(Object.assign(newDraft(),{name:'客户跟进消息',content:'您好 {{?姓名}}，\n\n关于您在 {{date}} 提出的需求，我们已经开始处理。\n\n{{user}}'}));}
  })));
  $('prototypeApp').addEventListener('input',e=>{
    if(e.target.dataset.variable!==undefined&&state.modal&&state.modal.kind==='variables'){state.modal.values[e.target.dataset.variable]=e.target.value;updateVariablePreview();}
    if(state.view==='editor'&&e.target.closest('#editorView'))updateEditorPreview();
  });
  $('prototypeApp').addEventListener('change',e=>{
    if(state.view==='editor'&&e.target.closest('#editorView'))updateEditorPreview();
    if(e.target.id==='settingOutput'){state.settings.output=e.target.value;persist();}
    if(e.target.id==='settingTheme'){state.settings.theme=e.target.value;persist();theme();}
    if(e.target.id==='settingDelimiter'){state.settings.delimiter=e.target.value;cache=new Map();persist();toast('解析定界符已更新，现有模板内容保持原样。');}
    if(e.target.id==='importFile')importData(e.target.files[0]);
  });
  document.addEventListener('keydown',e=>{
    if(e.isComposing||e.keyCode===229)return;
    if(!e.target.closest('#prototypeApp')&&!state.modal)return;
    const mod=e.metaKey||e.ctrlKey;
    if(state.modal){
      if(e.key==='Escape'){e.preventDefault();closeModal();return;}
      if(e.key==='Tab'){const f=Array.from($('overlay').querySelectorAll('button,input,select,textarea,a[href]')).filter(x=>!x.disabled&&!x.hidden&&x.getClientRects().length);const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}
      if(state.modal.kind==='variables'&&e.key==='Enter'&&(mod||e.altKey||e.target.hasAttribute('data-variable'))){
        e.preventDefault();if(mod||e.altKey){completeVariables(e.altKey?(state.modal.mode==='paste'?'copy':'paste'):undefined);return;}
        const f=Array.from($('overlay').querySelectorAll('[data-variable]')),i=f.indexOf(document.activeElement);if(i>=0&&i<f.length-1)f[i+1].focus();else if(i===f.length-1)completeVariables();return;
      }
      if(state.modal.kind==='group-form'&&e.key==='Enter'){e.preventDefault();saveGroup();}
      return;
    }
    if(mod&&e.key.toLowerCase()==='n'){e.preventDefault();leaveEditor(()=>openEditor());return;}
    if(mod&&['k','f'].includes(e.key.toLowerCase())){e.preventDefault();leaveEditor(()=>{state.view='list';render();$('searchInput').focus();$('searchInput').select();});return;}
    if(state.view==='editor'){if(mod&&e.key==='Enter'){e.preventDefault();saveDraft();}else if(e.key==='Escape'){e.preventDefault();if(!$('catalogMenu').hidden)$('catalogMenu').hidden=true;else leaveEditor();}return;}
    if(state.view==='settings'){if(e.key==='Escape'){state.view='list';render();$('searchInput').focus();}return;}
    if(e.target.closest('select')||e.target.closest('.detail-tabs'))return;
    if(mod&&e.key.toLowerCase()==='e'){e.preventDefault();if(selected())openEditor(selected());return;}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();changeSelection(e.key==='ArrowDown'?1:-1);return;}
    if(e.key==='Enter'&&(e.target.id==='searchInput'||e.target.closest('[role=option]'))&&!e.target.closest('button')){e.preventDefault();requestOutput(selected(),e.altKey?(state.settings.output==='paste'?'copy':'paste'):state.settings.output);return;}
    if(e.key==='Escape'){e.preventDefault();if(state.query)doAction('clear-search');else{$('searchInput').focus();toast('正式插件会返回上一个应用；此处保留设计稿。');}}
  });
  $('searchIcon').innerHTML=icon('search');$('searchClear').innerHTML=icon('close');$('settingsButton').innerHTML=icon('settings');$('resetButton').innerHTML=icon('refresh');
  render();
})();
</script>
</body>
</html>
